<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" role="img" aria-label="Animación del algoritmo SIEVE: el puntero hand barre la lista limpiando bits visited hasta encontrar un nodo con visited=0 y lo expulsa">
<rect width="1200" height="430" rx="22" fill="#15110E"/>
<text x="50" y="62" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" letter-spacing="4" fill="#E7B04A">SIEVE · LAZY PROMOTION</text>
<text x="50" y="100" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#F7EFE2">Un barrido, cero reordenamientos</text>
<text x="50" y="172" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#B8A894">◂ HEAD · nuevos</text>
<text x="1150" y="172" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#B8A894">antiguos · TAIL ▸</text>
<line x1="50" y1="150" x2="1150" y2="150" stroke="#E7B04A" stroke-opacity=".25"/>
<g><rect x="50" y="190" width="140" height="90" rx="14" fill="none" stroke="#B8A894" stroke-dasharray="6 6" opacity=".6"><animate attributeName="opacity" values="0.6;0.6;0;0;0.6" keyTimes="0.00000;0.64615;0.67692;0.94615;1.00000" dur="13s" begin="0s" repeatCount="indefinite"/></rect><text x="120" y="240" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#B8A894" opacity=".8">nuevo</text></g><g><rect x="210" y="190" width="140" height="90" rx="14" fill="#241A15" stroke="#E7B04A" stroke-width="2"><animate attributeName="stroke" values="#E7B04A;#E7B04A" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="280" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="38" fill="#F7EFE2">F</text><circle cx="240" cy="262" r="7" fill="none" stroke="#B8A894" stroke-width="2"><animate attributeName="fill" values="none;none" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></circle><text x="256" y="267" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#B8A894">visited=<tspan font-weight="700" fill="#F7EFE2">0</tspan></text><animate attributeName="opacity" values="1;1" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite"/></g><g><rect x="370" y="190" width="140" height="90" rx="14" fill="#241A15" stroke="#E7B04A" stroke-width="2"><animate attributeName="stroke" values="#E7B04A;#E7B04A" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="440" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="38" fill="#F7EFE2">E</text><circle cx="400" cy="262" r="7" fill="#2F9E8F" stroke="#2F9E8F" stroke-width="2"><animate attributeName="fill" values="#2F9E8F;#2F9E8F" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></circle><text x="416" y="267" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#B8A894">visited=<tspan font-weight="700" fill="#F7EFE2">1</tspan></text><animate attributeName="opacity" values="1;1" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite"/></g><g><rect x="530" y="190" width="140" height="90" rx="14" fill="#241A15" stroke="#E7B04A" stroke-width="2"><animate attributeName="stroke" values="#E7B04A;#E8604C;#E8604C;#E7B04A" keyTimes="0.00000;0.46154;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="600" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="38" fill="#F7EFE2">D</text><circle cx="560" cy="262" r="7" fill="none" stroke="#B8A894" stroke-width="2"><animate attributeName="fill" values="none;none" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></circle><text x="576" y="267" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#B8A894">visited=<tspan font-weight="700" fill="#F7EFE2">0</tspan></text><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0.00000;0.55385;0.59231;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite"/></g><g><rect x="690" y="190" width="140" height="90" rx="14" fill="#241A15" stroke="#E7B04A" stroke-width="2"><animate attributeName="stroke" values="#E7B04A;#E7B04A" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="760" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="38" fill="#F7EFE2">C</text><circle cx="720" cy="262" r="7" fill="#2F9E8F" stroke="#2F9E8F" stroke-width="2"><animate attributeName="fill" values="#2F9E8F;none;none;#2F9E8F" keyTimes="0.00000;0.35385;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></circle><text x="736" y="267" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#B8A894">visited=<tspan font-weight="700" fill="#F7EFE2">1</tspan></text><rect x="735" y="253" width="86" height="18" fill="#241A15" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.00000;0.35385;0.35462;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="736" y="267" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#B8A894" opacity="0">visited=<tspan font-weight="700" fill="#F7EFE2">0</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.00000;0.35385;0.35462;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></text><animate attributeName="opacity" values="1;1" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite"/></g><g><rect x="850" y="190" width="140" height="90" rx="14" fill="#241A15" stroke="#E7B04A" stroke-width="2"><animate attributeName="stroke" values="#E7B04A;#E7B04A" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="920" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="38" fill="#F7EFE2">B</text><circle cx="880" cy="262" r="7" fill="#2F9E8F" stroke="#2F9E8F" stroke-width="2"><animate attributeName="fill" values="#2F9E8F;none;none;#2F9E8F" keyTimes="0.00000;0.23846;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></circle><text x="896" y="267" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#B8A894">visited=<tspan font-weight="700" fill="#F7EFE2">1</tspan></text><rect x="895" y="253" width="86" height="18" fill="#241A15" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.00000;0.23846;0.23923;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="896" y="267" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#B8A894" opacity="0">visited=<tspan font-weight="700" fill="#F7EFE2">0</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.00000;0.23846;0.23923;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></text><animate attributeName="opacity" values="1;1" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite"/></g><g><rect x="1010" y="190" width="140" height="90" rx="14" fill="#241A15" stroke="#E7B04A" stroke-width="2"><animate attributeName="stroke" values="#E7B04A;#E7B04A" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="1080" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="38" fill="#F7EFE2">A</text><circle cx="1040" cy="262" r="7" fill="#2F9E8F" stroke="#2F9E8F" stroke-width="2"><animate attributeName="fill" values="#2F9E8F;none;none;#2F9E8F" keyTimes="0.00000;0.12308;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></circle><text x="1056" y="267" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#B8A894">visited=<tspan font-weight="700" fill="#F7EFE2">1</tspan></text><rect x="1055" y="253" width="86" height="18" fill="#241A15" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.00000;0.12308;0.12385;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="1056" y="267" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#B8A894" opacity="0">visited=<tspan font-weight="700" fill="#F7EFE2">0</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.00000;0.12308;0.12385;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></text><animate attributeName="opacity" values="1;1" keyTimes="0.00000;1.00000" dur="13s" begin="0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="50" y="190" width="140" height="90" rx="14" fill="#241A15" stroke="#2F9E8F" stroke-width="2.5"/><text x="120" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="38" fill="#F7EFE2">G</text><circle cx="80" cy="262" r="7" fill="none" stroke="#B8A894" stroke-width="2"/><text x="96" y="267" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#B8A894">visited=<tspan font-weight="700" fill="#F7EFE2">0</tspan></text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.00000;0.67692;0.71538;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite"/></g><g><animateTransform attributeName="transform" values="1080 0;1080 0;1080 0;920 0;920 0;760 0;760 0;600 0;600 0;440 0;440 0;1080 0" keyTimes="0.00000;0.08462;0.12308;0.20000;0.23846;0.31538;0.35385;0.43077;0.56923;0.63077;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite" type="translate"/><polygon points="0,292 -14,318 14,318" fill="#E8604C"/><rect x="-30" y="320" width="60" height="24" rx="12" fill="#E8604C"/><text x="0" y="337" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#fff">hand</text></g><text x="600" y="395" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#F7EFE2" opacity="0">La caché está llena y llega una consulta nueva (miss). Hay que expulsar algo.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.00000;0.00008;0.02308;0.08462;0.10769;1.00000" dur="13s" begin="0s" repeatCount="indefinite"/></text><text x="600" y="395" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#F7EFE2" opacity="0">hand recorre de la cola hacia la cabeza: visited=1 → se pone en 0 y avanza (sin mover nodos).<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.00000;0.10769;0.13077;0.39231;0.41538;1.00000" dur="13s" begin="0s" repeatCount="indefinite"/></text><text x="600" y="395" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#F7EFE2" opacity="0">D tiene visited=0 → es candidata y se expulsa. hand queda en su anterior (E).<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.00000;0.41538;0.43846;0.63846;0.66154;1.00000" dur="13s" begin="0s" repeatCount="indefinite"/></text><text x="600" y="395" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#F7EFE2" opacity="0">El nuevo elemento entra por head con visited=0. Sin reordenar nada en los hits.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.00000;0.66154;0.68462;0.93077;0.95385;1.00000" dur="13s" begin="0s" repeatCount="indefinite"/></text>
</svg>